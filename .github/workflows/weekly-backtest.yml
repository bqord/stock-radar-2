name: weekly backtest

on:
  schedule:
    - cron: "0 23 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: long backtest
        run: python backtest.py --download

      - name: build site
        run: python build_site.py

      - name: commit results
        run: |
          git config user.name  "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data docs
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "backtest: $(date -u +%Y-%m-%d)"
            git push
          fi
